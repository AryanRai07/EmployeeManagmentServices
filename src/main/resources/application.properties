#spring.servlet.contextPath=/em_portal
server.servlet.contextPath=/em_portal
server.port=8081

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.file-size-threshold=1KB


# Hibernate configuration
spring.datasource.name=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=employee_management
#spring.datasource.url=jdbc:postgresql://localhost:5433/personal_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true